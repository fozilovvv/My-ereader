{% extends 'base.html' %}

{% block title %}Вход — Библиотека{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Вход</h1>
    <p class="auth-sub">Войди, чтобы библиотека помнила, где ты остановился.</p>

    <form method="post">
      {% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <button type="submit" class="primary-btn wide">Войти</button>
    </form>

    <p class="auth-alt">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
